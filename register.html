<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ثبت‌نام | زبان دی</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div class="login-page">

        <div class="login-container">


            <!-- بخش معرفی -->

            <div class="login-intro">

                <div class="logo">
                    <span>زبان دی</span>
                    <small>LANGUAGE ACADEMY</small>
                </div>

                <span class="login-label">
                    ثبت‌نام زبان‌آموز
                </span>

                <h1>
                    مسیر یادگیری
                    <span>خودت را شروع کن</span>
                </h1>

                <p>
                    با ایجاد حساب کاربری در زبان دی،
                    به دوره‌ها، کلاس‌ها، برنامه آموزشی
                    و کلاس‌های آنلاین دسترسی خواهید داشت.
                </p>

                <div class="login-features">

                    <div>
                        <strong>🎓</strong>
                        <span>انتخاب دوره</span>
                    </div>

                    <div>
                        <strong>📅</strong>
                        <span>برنامه کلاس</span>
                    </div>

                    <div>
                        <strong>🎥</strong>
                        <span>کلاس آنلاین</span>
                    </div>

                </div>

            </div>


            <!-- فرم ثبت نام -->

            <div class="login-box">

                <div class="login-box-header">

                    <h2>
                        ایجاد حساب
                    </h2>

                    <p>
                        اطلاعات خود را وارد کنید.
                    </p>

                </div>


                <form>


                    <div class="form-group">

                        <label for="fullname">
                            نام و نام خانوادگی
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            placeholder="مثلاً محدثه باسره"
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            شماره موبایل
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="09xxxxxxxxx"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            ایمیل
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@email.com"
                        >

                    </div>


                    <div class="form-group">

                        <label for="register-password">
                            رمز عبور
                        </label>

                        <input
                            type="password"
                            id="register-password"
                            placeholder="رمز عبور خود را وارد کنید"
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-btn login-btn"
                    >
                        ثبت‌نام
                    </button>


                </form>


                <div class="login-register">

                    قبلاً حساب ساخته‌اید؟

                    <a href="login.html">
                        وارد شوید
                    </a>

                </div>

            </div>

        </div>

    </div>


</body>

</html>
