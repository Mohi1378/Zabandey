<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ورود | زبان دی</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div class="login-page">

        <div class="login-container">


            <!-- بخش معرفی -->

            <div class="login-intro">

                <div class="logo">
                    <span>زبان دی</span>
                    <small>LANGUAGE ACADEMY</small>
                </div>

                <span class="login-label">
                    پنل کاربری
                </span>

                <h1>
                    به زبان دی
                    <span>خوش آمدید</span>
                </h1>

                <p>
                    برای دسترسی به کلاس‌ها، دوره‌ها،
                    نمرات و امکانات آموزشی وارد حساب
                    کاربری خود شوید.
                </p>

                <div class="login-features">

                    <div>
                        <strong>🎓</strong>
                        <span>مدیریت کلاس‌ها</span>
                    </div>

                    <div>
                        <strong>📚</strong>
                        <span>دسترسی به دوره‌ها</span>
                    </div>

                    <div>
                        <strong>🎥</strong>
                        <span>کلاس آنلاین</span>
                    </div>

                </div>

            </div>


            <!-- فرم ورود -->

            <div class="login-box">

                <div class="login-box-header">

                    <h2>
                        ورود به حساب
                    </h2>

                    <p>
                        اطلاعات حساب خود را وارد کنید.
                    </p>

                </div>


                <form>


                    <div class="form-group">

                        <label for="username">
                            نام کاربری
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="نام کاربری خود را وارد کنید"
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            رمز عبور
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="رمز عبور خود را وارد کنید"
                        >

                    </div>


                    <div class="login-options">

                        <label>
                            <input type="checkbox">
                            مرا به خاطر بسپار
                        </label>

                        <a href="#">
                            فراموشی رمز عبور؟
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="primary-btn login-btn"
                    >
                        ورود به حساب
                    </button>


                </form>


                <div class="login-register">

                    حساب کاربری ندارید؟

                    <a href="#">
                        ثبت‌نام کنید
                    </a>

                </div>

            </div>

        </div>

    </div>


</body>

</html>
